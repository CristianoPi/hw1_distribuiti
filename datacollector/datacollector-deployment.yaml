apiVersion: apps/v1
kind: Deployment
metadata:
  name: datacollector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datacollector
  template:
    metadata:
      labels:
        app: datacollector
    spec:
      containers:
      - name: datacollector
        image: docker.io/library/my_datacollector_image:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: "db"
        - name: DB_PORT
          value: "3306"
        ports:
        - containerPort: 8000  # Porta per le metriche Prometheus